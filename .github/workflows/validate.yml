name: Validate EPs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate EPs
        run: |
          chmod +x validate.sh
          # Find the first available EP directory
          if [ -f ".ep-kit" ] && [ -d "docs/eps" ]; then
            ./validate.sh --json docs/eps/
          elif [ -d "docs/eps" ]; then
            ./validate.sh --json docs/eps/
          elif [ -d "docs/geps" ]; then
            ./validate.sh --json docs/geps/
          elif [ -d "examples" ]; then
            ./validate.sh --json examples/
          else
            echo "No EP directory found"
            exit 1
          fi

      - name: Run regression tests
        run: tests/test.sh
